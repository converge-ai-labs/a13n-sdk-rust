[package]
name = "agent-foundation-cli"
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
authors = ["Converge AI"]
license = "Apache-2.0"
repository = "https://github.com/converge-ai-labs/agent-foundation"
description = "Command-line client for Agent Foundation Service"
readme = "README.md"
publish = false

[[bin]]
name = "agent-foundation"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }

[workspace]
resolver = "2"
